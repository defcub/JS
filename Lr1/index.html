<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Лабораторна робота JS - Кабан Тарас</title>
    <!-- Використовуємо defer замість type="module", щоб код працював без сервера -->
    <script src="main.js" defer></script>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; max-width: 800px; margin: 0 auto; color: #333; }
        
        /* Стилі для блоків з рівнями */
        .level-section { 
            margin-bottom: 25px; 
            padding: 20px; 
            border: 1px solid #ddd; 
            border-radius: 8px; 
            background: #f9f9fa; 
        }
        .level-section h3 { margin-top: 0; color: #2c3e50; border-bottom: 2px solid #e0e0e0; padding-bottom: 10px; }
        
        .btn-group { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 15px; }
        button { padding: 10px 15px; cursor: pointer; border: 1px solid #ccc; border-radius: 5px; background: #fff; transition: 0.2s; }
        button:hover { background: #e0e0e0; }
        
        #output { padding: 20px; border: 2px dashed #aaa; border-radius: 5px; min-height: 100px; background: #fff; margin-top: 20px;}
        
        /* Стилі для останнього завдання */
        .letter-block {
            display: inline-block; width: 40px; height: 40px; border: 2px solid #333;
            margin: 5px; text-align: center; line-height: 40px; background-color: #e3f2fd; cursor: pointer;
            font-weight: bold; border-radius: 4px;
        }
    </style>
</head>
<body>

    <h2>Індивідуальні завдання JavaScript</h2>
    
    <!-- РІВЕНЬ 4-6 БАЛІВ -->
    <div class="level-section">
        <h3>Рівень 4-6 балів</h3>
        <div class="btn-group">
            <button id="btn-task1">1 Діалогове вікно (Привітання)</button>
            <button id="btn-task2">2 Кнопки (ОК / Відміна)</button>
            <button id="btn-task3">3 Таблиця множення</button>
        </div>
    </div>

    <!-- РІВЕНЬ 7-9 БАЛІВ -->
    <div class="level-section">
        <h3>Рівень 7-9 балів</h3>
        <div class="btn-group">
            <button id="btn-task4">1 Парне / Непарне число</button>
            <button id="btn-task5">2 Генератор пароля</button>
            <button id="btn-task6">3 Середній бал (id)</button>
            <button id="btn-task7">4 Список студентів</button>
        </div>
    </div>

    <!-- РІВЕНЬ 10-12 БАЛІВ -->
    <div class="level-section">
        <h3>Рівень 10-12 балів</h3>
        <div class="btn-group">
            <button id="btn-task8">1 Літери імені (ul)</button>
            <button id="btn-task9">2 Введення до "Відміни"</button>
            <button id="btn-task10">3 Показати блоки з прізвищем</button>
        </div>
    </div>

    <h3>Результат виконання:</h3>
    <div id="output">Тут з'явиться результат...</div>

</body>
</html>
