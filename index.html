<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Лабораторні роботи з JavaScript</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            max-width: 800px;
            margin: 0 auto;
            padding: 40px 20px;
        }
        .header {
            text-align: center;
            margin-bottom: 40px;
            padding-bottom: 20px;
            border-bottom: 2px solid #ddd;
        }
        .header h1 {
            margin: 0 0 10px 0;
            color: #2c3e50;
        }
        .header p {
            margin: 5px 0;
            color: #555;
            font-size: 1.1em;
        }
        .lab-list {
            list-style: none;
            padding: 0;
        }
        .lab-list li {
            margin-bottom: 15px;
        }
        .lab-link {
            display: block;
            padding: 15px 20px;
            background: #fff;
            border: 1px solid #ccc;
            border-radius: 8px;
            text-decoration: none;
            color: #2980b9;
            font-weight: bold;
            font-size: 1.2em;
            transition: all 0.3s ease;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }
        .lab-link:hover {
            background: #2980b9;
            color: #fff;
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        .disabled-link {
            display: block;
            padding: 15px 20px;
            background: #e9ecef;
            border: 1px solid #ccc;
            border-radius: 8px;
            color: #999;
            font-size: 1.2em;
            cursor: not-allowed;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>Лабораторні роботи з JavaScript</h1>
        <p><strong>Студент:</strong> Кабан Тарас Іванович</p>
    </div>

    <ul class="lab-list">
        <li>
            <!-- Посилання веде в папку lr1 на файл index.html -->
            <a href="Lr1/index.html" class="lab-link">Лабораторна робота №1M</a>
        </li>
        <li>
            <a href="Lr2/index.html" class="lab-link">Лабораторна робота №2</a>
        </li>
    </ul>

</body>
</html>
