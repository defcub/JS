<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>ЛР14 — i18next</title>
    <script src="https://unpkg.com/i18next@21.6.16/dist/umd/i18next.min.js" defer></script>
    <script src="i18next-demo.js" defer></script>
</head>
<body>
    <h1 data-i18n="greeting"></h1>
    <p data-i18n="farewell"></p>

    <label for="language-selector" data-i18n="language"></label>
    <select id="language-selector">
        <option value="en" lang="en">English</option>
        <option value="uk" lang="uk">Українська</option>
    </select>

    <p id="status" role="status"></p>
</body>
</html>
