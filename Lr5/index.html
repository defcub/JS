<div style="margin-bottom: 20px; padding: 15px; border: 1px solid #ccc; max-width: 400px; font-family: Arial, sans-serif;">
    <h3 style="margin-top: 0;">Конвертер температур</h3>
    
    <div style="margin-bottom: 10px;">
        <label for="fahrenheit" style="display: inline-block; width: 220px;">Температура за Фаренгейтом</label>
        <input type="number" id="fahrenheit" step="any">
    </div>
    
    <div>
        <label for="celsius" style="display: inline-block; width: 220px;">Температура за Цельсієм</label>
        <input type="number" id="celsius" step="any">
    </div>
</div>



<!-- ЗАВДАННЯ 2 -->

<div style="margin-bottom: 20px; padding: 15px; border: 1px solid #ccc; max-width: 400px; font-family: Arial, sans-serif;">
    <h3 style="margin-top: 0;">Завдання 2: Таблиця множення</h3>

    <p id="score" style="font-weight: bold; color: #27ae60;">Загальний рахунок 0% (0 правильних відповідей з 0)</p>
    
    <button id="nextBtn">наступне завдання</button>
    <br><br>

    <span id="taskText" style="font-size: 18px; font-weight: bold;"></span>
    <input type="number" id="answer" style="width: 60px; padding: 5px;">
    <button id="checkBtn">перевірити</button>
    
    <!-- Результат перевірки -->
    <p id="resultMsg" style="font-weight: bold; min-height: 20px;"></p>
</div>

<div style="margin-bottom: 20px; font-family: Arial, sans-serif; width: 120px;">
    <p style="margin: 0 0 10px 0;">Введіть число</p>
    
    <!-- Блок для  капчі -->
    <div id="captchaBox" style="display: flex; gap: 5px; border: 2px solid #ccc; padding: 5px; height: 50px; background: #fff;"></div>

    <input type="text" id="captchaInput" style="border: 1px solid #ccc; border-top: none; padding: 5px; width: 100%; box-sizing: border-box; font-size: 16px;">
    
    <button id="checkCaptchaBtn" style="margin-top: 10px;">Перевірити</button>
    <div id="captchaResult" style="margin-top: 5px; font-size: 14px;"></div>
</div>
