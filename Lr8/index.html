<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ЛР8 — ToDo List</title>

    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <main class="todo">
        <a href="../index.html" class="back-link">
            Повернутися на головну
        </a>
        <h1>ToDo List</h1>

        <label for="task-input">Нове завдання</label>

        <input
            id="task-input"
            type="text"
            placeholder="Введи завдання та натисни Enter"
            autocomplete="off"
        >

        <div class="sort-controls">
            <button id="sort-incomplete" type="button">
                Спочатку невиконані
            </button>

            <button id="sort-completed" type="button">
                Спочатку виконані
            </button>
        </div>

        <ul id="task-list"></ul>
    </main>
</body>
</html>
