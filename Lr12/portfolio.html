    <!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Портфоліо проєктів - Supabase</title>
    <link rel="stylesheet" href="styles/style.css">
    <script type="module" src="js/portfolio.js"></script>
</head>
<body>
    <main class="container">
        <a class="back-link" href="index.html">До каталогу книг</a>
        <h1>Портфоліо проєктів</h1>
        <p id="portfolio-role" role="status"></p>   
        <section aria-labelledby="catalog-heading">
            <h2 id="catalog-heading">Каталог</h2>

            <div class="catalog-controls">
                <label for="project-search">Пошук за назвою або описом</label>
                <input id="project-search" type="search">

                <label for="category-filter">Категорія</label>
                <select id="category-filter">
                    <option value="all">Усі категорії</option>
                    <option value="website">Вебсайти</option>
                    <option value="application">Застосунки</option>
                </select>

                <label for="project-sort">Сортування</label>
                <select id="project-sort">
                    <option value="default">За порядком додавання</option>
                    <option value="az">За назвою: А–Я</option>
                    <option value="za">За назвою: Я–А</option>
                </select>
            </div>

            <p id="catalog-status" role="status"></p>
            <ul id="project-list"></ul>
        </section>

        <section id="project-admin" aria-labelledby="form-heading" hidden></section>
            <h2 id="form-heading">Додати проєкт</h2>
            <button id="cancel-project" type="button" hidden>
                Скасувати редагування
            </button>
            <form id="project-form">
                <label for="project-title">Назва</label>
                <input id="project-title" required maxlength="150">

                <label for="project-description">Опис</label>
                <textarea id="project-description" rows="3"
                          required maxlength="500"></textarea>

                <label for="project-category">Категорія проєкту</label>
                <select id="project-category" required>
                    <option value="">Оберіть категорію</option>
                    <option value="website">Вебсайт</option>
                    <option value="application">Застосунок</option>
                </select>

                <button type="submit" disabled>Додати проєкт</button>
            </form>

            <p id="form-status" role="status"></p>
        </section>
    </main>
</body>
</html>
