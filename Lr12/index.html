<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Каталог книг — Supabase</title>
    <link rel="stylesheet" href="styles/style.css">
    <script type="module" src="js/app.js"></script>
</head>
<body>
    <main class="container">
        <a class="back-link" href="../index.html">На головну</a>
        <h1>Каталог книг</h1>
        <a href="portfolio.html">Індивідуальне завдання - Портфоліо проєктів</a>
        <p id="status" role="status" aria-live="polite"></p>

        <section aria-labelledby="books-heading">
            <h2 id="books-heading">Список книг</h2>
            <ul id="books-list"></ul>
        </section>

        <section aria-labelledby="form-heading">
            <h2 id="form-heading">Додати книгу</h2>

            <form id="book-form">
                <label for="title">Назва книги</label>
                <input id="title" name="title" required maxlength="150">

                <label for="author">Автор</label>
                <input id="author" name="author" required maxlength="150">

                <button type="submit" disabled>Додати</button>
            </form>
        </section>
    </main>
</body>
</html>
