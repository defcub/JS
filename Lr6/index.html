<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CSS Generator</title>

    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <main class="generator">
        <a href="../index.html" class="back-link">Повернутися на головну</a>
        <h1>CSS Generator</h1>
        <p>Варіант 7: padding і text-transform</p>

        <!-- Кнопки вкладок -->
        <div class="tabs" id="tabs">
            <button
                class="tab active"
                type="button"
                data-tab="radius"
            >
                Border Radius
            </button>

            <button
                class="tab"
                type="button"
                data-tab="padding"
            >
                Padding
            </button>

            <button
                class="tab"
                type="button"
                data-tab="text-transform"
            >
                Text Transform
            </button>
        </div>

        <!-- Перша вкладка: заокруглення кутів -->
        <div class="tab-content active" data-content="radius">
            <h2>Border Radius</h2>

            <div class="control">
                <label for="top-left">Верхній лівий</label>

                <input
                    id="top-left"
                    type="range"
                    min="0"
                    max="100"
                    value="0"
                >

                <span id="top-left-value">0 px</span>
            </div>

            <div class="control">
                <label for="top-right">Верхній правий</label>

                <input
                    id="top-right"
                    type="range"
                    min="0"
                    max="100"
                    value="0"
                >

                <span id="top-right-value">0 px</span>
            </div>

            <div class="control">
                <label for="bottom-right">Нижній правий</label>

                <input
                    id="bottom-right"
                    type="range"
                    min="0"
                    max="100"
                    value="0"
                >

                <span id="bottom-right-value">0 px</span>
            </div>

            <div class="control">
                <label for="bottom-left">Нижній лівий</label>

                <input
                    id="bottom-left"
                    type="range"
                    min="0"
                    max="100"
                    value="0"
                >

                <span id="bottom-left-value">0 px</span>
            </div>
        </div>

        <!-- Друга вкладка: внутрішній відступ -->
        <div class="tab-content" data-content="padding">
            <h2>Padding</h2>

            <div id="property-2-controls">
                <div class="control">
                    <label for="padding">Внутрішній відступ</label>

                    <input
                        id="padding"
                        type="range"
                        min="0"
                        max="60"
                        value="0"
                    >

                    <span id="padding-value">0 px</span>
                </div>
            </div>
        </div>

        <!-- Третя вкладка: регістр тексту -->
        <div class="tab-content" data-content="text-transform">
            <h2>Text Transform</h2>

            <div id="property-3-controls">
                <div class="control">
                    <label for="text-transform">Регістр тексту</label>

                    <select id="text-transform">
                        <option value="none">Без змін</option>
                        <option value="uppercase">ВЕЛИКІ ЛІТЕРИ</option>
                        <option value="lowercase">малі літери</option>
                        <option value="capitalize">
                            Кожне Слово З Великої
                        </option>
                    </select>
                </div>
            </div>
        </div>

        <!-- Попередній перегляд -->
        <section class="preview-section">
            <h2>Preview</h2>

            <div id="preview" class="preview">
                <span>Hello world</span>

                <button id="preview-button" type="button">
                    Click
                </button>
            </div>

            <p id="coordinates">X: 0; Y: 0</p>
            <p>Натисни Escape, щоб скинути всі повзунки.</p>
        </section>

        <!-- Згенерований CSS -->
        <section class="result">
            <h2>CSS Code</h2>

            <textarea
                id="css-code"
                rows="6"
                readonly
                aria-label="Згенерований CSS-код"
            ></textarea>

            <button id="copy-button" type="button">
                Скопіювати CSS
            </button>

            <p id="copy-message" role="status"></p>
        </section>

        <!-- Форма пресета -->
        <form id="preset-form">
            <h2>Збереження пресета</h2>

            <label for="preset-name">Назва пресета</label>

            <input
                id="preset-name"
                type="text"
                aria-describedby="preset-error"
            >

            <span id="preset-error" aria-live="polite"></span>

            <button type="submit">Зберегти</button>
        </form>
    </main>

    <button
        id="scroll-top"
        type="button"
        aria-label="Повернутися вгору"
    >
        ↑
    </button>
</body>
</html>
