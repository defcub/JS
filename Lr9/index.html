<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ЛР9 — JavaScript Promise</title>
    <script src="script.js" defer></script>
    
</head>
<body>
    <a href="../index.html">← Повернутися на головну</a>
    <h1>JavaScript Promise</h1>

    <section>
    <h2>Завдання 1. Привітання</h2>
    <button type="button" id="greeting-button">Показати привітання</button>
    </section>

    <section>
        <h2>Завдання 2. Перевірка числа</h2>
        <label for="check-input">Число</label>
        <input id="check-input" type="number" step="any" value="10" required>
        <button type="button" id="check-button">Перевірити</button>
    </section>

    <section>
        <h2>Завдання 3. Випадкове число</h2>
        <button type="button" id="random-button">Отримати число</button>
    </section>

    <section>
        <h2>Завдання 4. Порівняння чисел</h2>
        <label for="first-number">Перше число</label>
        <input id="first-number" type="number" step="any" value="8" required>

        <label for="second-number">Друге число</label>
        <input id="second-number" type="number" step="any" value="5" required>

        <button type="button" id="compare-button">Порівняти</button>
    </section>

    <section>
        <h2>Завдання 5. Сума трьох чисел</h2>
        <button type="button" id="sum-button">Обчислити суму</button>
    </section>

    <div id="loader" role="status" style="display: none;">Завантаження...</div>
    <div id="result" aria-live="polite"></div>
</body>
</html>
