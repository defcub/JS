<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Лабораторна робота №2 - Кабан Тарас</title>
    <script src="main.js" defer></script>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; max-width: 800px; margin: 0 auto; color: #333; }
        .level-section { margin-bottom: 25px; padding: 20px; border: 1px solid #ddd; border-radius: 8px; background: #f9f9fa; }
        .level-section h3 { margin-top: 0; color: #2c3e50; border-bottom: 2px solid #e0e0e0; padding-bottom: 10px; }
        .btn-group { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 15px; }
        button { padding: 10px 15px; cursor: pointer; border: 1px solid #ccc; border-radius: 5px; background: #fff; transition: 0.2s; }
        button:hover { background: #e0e0e0; }
        #output { padding: 20px; border: 2px dashed #aaa; border-radius: 5px; min-height: 100px; background: #fff; margin-top: 20px;}
        .back-link { display: inline-block; margin-bottom: 20px; text-decoration: none; color: #2980b9; font-weight: bold; }
    </style>
</head>
<body>

    <h2>Лабораторна робота №2</h2>
    <!-- Кнопка повернення на головне меню (виходить на папку вище) -->
    <a href="../index.html" class="back-link">⬅ Повернутися на головну</a>
    
    <div class="level-section">
        <h3>Рівень 4-6 балів</h3>
        <div class="btn-group">
            <button id="btn-task1-1">1 Привітання</button>
            <button id="btn-task1-2">2 Рік народження</button>
            <button id="btn-task1-3">3 Повне ім'я (в консоль)</button>
        </div>
    </div>

    <div class="level-section">
        <h3>Рівень 7-9 балів</h3>
        <div class="btn-group">
            <button id="btn-task2-1">1 Області видимості</button>
            <button id="btn-task2-2">2 Confirm: Continue?</button>
            <button id="btn-task2-3">3 Парне / Непарне</button>
        </div>
    </div>

    <div class="level-section">
        <h3>Рівень 10-12 балів</h3>
        <div class="btn-group">
            <button id="btn-task3-1">1 Видимість у функції</button>
            <button id="btn-task3-2">2 Секретне число</button>
            <button id="btn-task3-3">3 Сума чисел</button>
        </div>
    </div>

    <h3>Результат виконання:</h3>
    <div id="output">Тут з'явиться результат або підказка перевірити консоль...</div>

</body>
</html>
